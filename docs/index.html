}

.btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.notice { border: 1px solid var(--partial); background: var(--partial-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

      });
      s.envs[env.id] = e;
    });
    return s;
  }
  var stored = {};
  try { stored = JSON.parse(document.getElementById("results").textContent || "{}"); } catch (err) { stored = {}; }
  var state = normalize(stored);
  var dirty = false, readOnly = false, saving = false, artifactNs = null, capabilityKnown = false;
  // No Claude viewer around this page, e.g. when it is hosted on GitHub Pages.
  var standalone = !(window.claude && typeof window.claude.use === "function");

  function readDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return null; } }
  function writeDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ basis: state.savedAt, data: state })); } catch (e) {} }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  var staleDraft = null;
  var draft = readDraft();
  if (draft && draft.data) {
    if (draft.basis === state.savedAt) { state = normalize(draft.data); state.savedAt = draft.basis; dirty = true; }
    else { staleDraft = draft; }
  }

  // ---------- rendering ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function counts(envId) {
    var n = 0, total = 0, cells = state.envs[envId].cells;
    Object.keys(cells).forEach(function (k) { total++; if (cells[k].s) n++; });
    return n + "/" + total + " recorded";
  }
  function predHtml(text) {
    var unsure = text.charAt(0) === "?";
    var t = unsure ? text.slice(1) : text;
    return '<div class="pred">Predicted: ' + esc(t) + (unsure ? '<span class="unsure" title="Not confirmed from source">unverified</span>' : "") + "</div>";
  }
  function cellHtml(env, row, col) {
    var k = row.id + "|" + col.id, cell = state.envs[env.id].cells[k];
    var base = env.id + "-" + row.id + "-" + col.id;
    var seg = STATUSES.map(function (st) {
      return '<button type="button" id="' + base + "-" + st[0] + '" data-env="' + env.id + '" data-key="' + k + '" data-s="' + st[0] + '" aria-pressed="' + (cell.s === st[0]) + '">' + st[1] + "</button>";
    }).join("");
    return '<td class="cell" data-s="' + esc(cell.s) + '" id="' + base + '"><div class="cellbox">' + predHtml(env.pred[row.id][COLS.indexOf(col)]) +
      '<div class="seg" role="group" aria-label="' + esc(env.name + ", " + row.label + ", " + col.label) + '">' + seg + "</div>" +
      '<textarea id="' + base + '-notes" rows="1" placeholder="What you saw" data-env="' + env.id + '" data-key="' + k + '" data-field="cellnote" aria-label="Notes: ' + esc(row.label + ", " + col.label) + '">' + esc(cell.n) + "</textarea></div></td>";
  }
  function envHtml(env) {
    var e = state.envs[env.id];
    var meta = META.map(function (m) {
      return '<label for="' + env.id + "-meta-" + m[0] + '">' + esc(m[1]) + '<input type="text" id="' + env.id + "-meta-" + m[0] + '" data-env="' + env.id + '" data-field="meta" data-meta="' + m[0] + '" value="' + esc(e.meta[m[0]]) + '"></label>';
    }).join("");
    var head = "<tr><th>Test</th>" + COLS.map(function (c) { return "<th>" + esc(c.label) + '<span class="sub mono">' + esc(c.cmd) + "</span></th>"; }).join("") + "</tr>";
    var body = ROWS.map(function (r) {
      return '<tr><th scope="row">' + esc(r.label) + '<span class="hint">' + esc(r.hint) + "</span></th>" + COLS.map(function (c) { return cellHtml(env, r, c); }).join("") + "</tr>";
    }).join("");
    return '<section class="env" id="' + env.id + '"><div class="envhead"><h2>' + esc(env.name) + '</h2><span class="count" data-count="' + env.id + '">' + counts(env.id) + "</span></div>" +
      '<p class="envnote">' + esc(env.note) + "</p>" +
      '<div class="meta">' + meta + "</div>" +
      '<div class="tablewrap"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="envnotes"><label for="' + env.id + '-notes">Other observations<textarea id="' + env.id + '-notes" rows="2" data-env="' + env.id + '" data-field="envnote">' + esc(e.notes) + "</textarea></label></div></section>";
  }
  function render() {
    var root = document.getElementById("root");
    var nav = ENVS.map(function (env) { return '<a href="#' + env.id + '">' + esc(env.name) + ' <span class="count" data-count="' + env.id + '">' + counts(env.id) + "</span></a>"; }).join("");
    var modes = COLS.map(function (c) { return '<div class="mode"><span class="tag">' + c.id + "</span><b>" + esc(c.label.slice(3)) + "</b><code>./dtprobe-integrate.sh " + esc(c.cmd) + "</code></div>"; }).join("");
    root.innerHTML =
      '<header class="intro"><a class="repo" href="' + REPO + '">' + esc(REPO.replace("https://", "")) + "</a><h1>" + esc(TITLE) + "</h1>" +
      '<p class="lede">One grid per desktop: each test from the probe against each way of installing its .desktop file. Each cell shows what the source code predicts; record what you actually see. <code>$AppimagePath</code> is the full path to the AppImage. Run <code>./dtprobe-integrate.sh uninstall</code> and quit the probe between columns.</p></header>' +
      '<div class="modes">' + modes + "</div>" +
      '<div id="stale" hidden class="notice"><span>This browser has unsaved edits from before the last save.</span><button type="button" class="btn" id="restore-draft">Restore them</button><button type="button" class="btn" id="discard-draft">Discard</button></div>' +
      '<nav class="envnav" aria-label="Desktops">' + nav + "</nav>" +
      ENVS.map(envHtml).join("") +
      '<textarea id="md-out" hidden readonly aria-label="Exported results"></textarea>' +
      '<div class="savebar"><span class="msg" id="save-msg" role="status"></span><button type="button" class="btn" id="copy-json">Copy JSON</button><button type="button" class="btn" id="download-json" hidden>Download JSON</button><button type="button" class="btn" id="copy-md">Copy as Markdown</button><button type="button" class="btn primary" id="save">Save results</button></div>';
    document.getElementById("stale").hidden = !staleDraft;
    root.querySelectorAll("textarea").forEach(autosize);
    updateSaveBar();
  }
  function autosize(t) { if (t.id === "md-out") return; t.style.height = "auto"; t.style.height = Math.max(32, t.scrollHeight + 2) + "px"; }
  function updateCounts(envId) { document.querySelectorAll('[data-count="' + envId + '"]').forEach(function (el) { el.textContent = counts(envId); }); }
  function updateSaveBar(message) {
    var msg = document.getElementById("save-msg"), btn = document.getElementById("save");
    if (!msg) return;
    msg.classList.toggle("dirty", dirty && !message);
    if (message) msg.textContent = message;
    else if (readOnly) msg.textContent = "This view is read-only, so results can't be saved here. Copy them as Markdown instead.";
    else if (dirty) msg.textContent = "Unsaved changes (kept in this browser until you save).";
    else if (state.savedAt) msg.textContent = "Saved " + new Date(state.savedAt).toLocaleString() + ".";
    else msg.textContent = "Nothing recorded yet.";
    btn.disabled = saving || readOnly || !dirty || (capabilityKnown && !artifactNs);
    if (standalone && !message) msg.textContent = dirty ? "Edits are kept in this browser only. Use Download JSON to keep them." : "Edits you make are kept in this browser only. Use Download JSON to keep them.";
    else if (capabilityKnown && !artifactNs && !message) msg.textContent = "Saving isn't available in this view. Copy your results as Markdown to keep them.";
  }
  function markDirty() { dirty = true; writeDraft(); updateSaveBar(); }

  // ---------- events ----------
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.s && b.dataset.key) {
      var cell = state.envs[b.dataset.env].cells[b.dataset.key];
      cell.s = cell.s === b.dataset.s ? "" : b.dataset.s;
      var td = b.closest("td");
      td.dataset.s = cell.s;
      td.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.s === cell.s)); });
      updateCounts(b.dataset.env);
      markDirty();
    } else if (b.id === "save") { save(); }
    else if (b.id === "copy-md") { copyText(toMarkdown(), "Markdown"); }
    else if (b.id === "copy-json") { copyText(exportJson(), "JSON"); }
    else if (b.id === "download-json") { downloadJson(); }
    else if (b.id === "restore-draft" && staleDraft) {
      var basis = state.savedAt;
      state = normalize(staleDraft.data); state.savedAt = basis; staleDraft = null;
      render(); markDirty();
    } else if (b.id === "discard-draft") { staleDraft = null; clearDraft(); document.getElementById("stale").hidden = true; }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target, env = t.dataset && t.dataset.env;
    if (!env) return;
    if (t.dataset.field === "meta") state.envs[env].meta[t.dataset.meta] = t.value;
    else if (t.dataset.field === "cellnote") state.envs[env].cells[t.dataset.key].n = t.value;
    else if (t.dataset.field === "envnote") state.envs[env].notes = t.value;
    else return;
    if (t.tagName === "TEXTAREA") autosize(t);
    markDirty();
  });

  // ---------- markdown ----------
  function mdCell(s) { return String(s).replace(/\|/g, "\\|").replace(/\n+/g, " ").trim(); }
  function toMarkdown() {
    var label = { works: "✅", partial: "🟡", broken: "❌", na: "➖" };
    var out = ["# " + TITLE, "", "✅ works · 🟡 partly works · ❌ broken · ➖ not applicable · · not tested", ""];
    ENVS.forEach(function (env) {
      var e = state.envs[env.id];
      out.push("## " + env.name, "");
      META.forEach(function (m) { if (e.meta[m[0]]) out.push("- " + m[1] + ": " + mdCell(e.meta[m[0]])); });
      out.push("", "| Test | " + COLS.map(function (c) { return c.label; }).join(" | ") + " |", "|---|" + COLS.map(function () { return "---"; }).join("|") + "|");
      ROWS.forEach(function (r) {
        out.push("| " + r.label + " | " + COLS.map(function (c) {
          var cell = e.cells[r.id + "|" + c.id];
          var txt = cell.s ? label[cell.s] : "·";
          return mdCell(txt + (cell.n ? " " + cell.n : ""));
        }).join(" | ") + " |");
      });
      if (e.notes) out.push("", mdCell(e.notes));
      out.push("");
    });
    return out.join("\n");
  }
  function copyText(text, what) {
    var box = document.getElementById("md-out");
    function fallback() {
      box.value = text; box.hidden = false; box.focus(); box.select();
      updateSaveBar("Couldn't reach the clipboard. The " + what + " is selected below; copy it with Ctrl+C.");
    }
    try {
      navigator.clipboard.writeText(text).then(function () { box.hidden = true; updateSaveBar("Copied as " + what + "."); }, fallback);
    } catch (e) { fallback(); }
  }

  // ---------- json ----------
  // Exactly what the page stores, including edits not saved yet.
  function exportJson() { return JSON.stringify(state, null, 2) + "\n"; }
  var downloadsNs = null;
  function downloadJson() {
    if (standalone) {
      var url = URL.createObjectURL(new Blob([exportJson()], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url; a.download = "results.json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      updateSaveBar("Downloaded results.json.");
      return;
    }
    if (!downloadsNs) return;
    downloadsNs.save({ filename: "results.json", data: exportJson() }).then(function () {
      updateSaveBar("Downloaded results.json.");
    }, function (err) {
      var code = err && err.code;
      if (code === "declined") updateSaveBar("Download cancelled.");
      else if (code === "rate_limited") updateSaveBar("A download prompt is already open. Finish that one first.");
      else { document.getElementById("download-json").hidden = true; updateSaveBar("Downloads aren't available here. Use Copy JSON instead."); }
    });
  }

  // ---------- saving ----------
  function skeletonReset() {
    var st = document.head && document.head.querySelector("style");
    var txt = st && st.textContent || "";
    return txt.indexOf("safe-area-inset") >= 0 ? txt : FALLBACK_RESET;
  }
  function buildDocument() {
    var SC = "<" + "/script>";
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + skeletonReset() + "</style></head><body>" +
      "<title>" + TITLE + "</title><meta name=\"claude:viewport-fit-sides\" content=\"cover\">" + FONT_LINK +
      "<style id=\"css\">" + document.getElementById("css").textContent + "</style><main id=\"root\"></main>" +
      "<script type=\"application/json\" id=\"results\">" + json + SC +
      "<script id=\"app\">" + document.getElementById("app").textContent + SC + "</body></html>";
  }
  function save() {
    if (!artifactNs || saving || !dirty) return;
    var prev = state.savedAt;
    state.savedAt = new Date().toISOString();
    var html = buildDocument();
    saving = true; updateSaveBar("Saving…");
    artifactNs.publish(html).then(function () {
      clearDraft(); dirty = false; saving = false;
      updateSaveBar("Saved. Reloading to the new version…");
    }, function (err) {
      saving = false; state.savedAt = prev;
      var code = err && err.code;
      if (code === "conflict") { updateSaveBar("Someone saved a newer version. Reloading to it; your edits stay in this browser and you can restore them."); }
      else if (["not_writer", "not_granted", "not_declared", "capability_disabled", "capability_removed", "consent_required"].indexOf(code) >= 0) { readOnly = true; updateSaveBar(); }
      else if (code === "rate_limited") { updateSaveBar("Saved too often. Wait a minute, then save again."); }
      else if (code === "too_large") { updateSaveBar("The notes are too long to save. Shorten some, then save again."); }
      else { updateSaveBar("Couldn't save (" + (code || "unknown error") + "). Your edits are kept in this browser; try again."); }
      writeDraft();
    });
  }

  render();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (ns) {
      downloadsNs = ns;
      document.getElementById("download-json").hidden = !ns;
    }, function () {});
    window.claude.use("artifact").then(function (ns) { artifactNs = ns; capabilityKnown = true; updateSaveBar(); }, function () { capabilityKnown = true; updateSaveBar(); });
  } else {
    capabilityKnown = true;
    document.getElementById("save").hidden = true;
    document.getElementById("download-json").hidden = false;
    updateSaveBar();
  }
})();
</script>
</body></html>
